[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archetype"
version = "0.1.0"
description = "Archetype — a workspace for writing and maintaining a long narrative (P1-1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # P2-14, phase-2-plan section 2 ruling 3. The first new runtime dependency since P1-1,
    # and the only parser in the project we did not write: CommonMark is a specification with
    # corners (nested emphasis, lazy continuation, setext headings, list tightness) that a
    # hand-rolled parser gets subtly wrong in ways nobody notices until an import mangles a
    # chapter. Pure Python; pulls one 10 KB transitive, mdurl.
    "markdown-it-py>=3.0",
    # P4-5, P4-6, and specs/project-outline.md section 3: LLM access is HTTP via httpx, one
    # adapter per provider - no vendor SDK. It was already here as a test dependency (the
    # Starlette test client is built on it), and promoting it to a runtime dependency adds
    # nothing to the install that was not already present in development. The alternative was
    # two vendor SDKs, each large, each with its own retry policy to disable (ruling 6), and
    # each pulling a transitive tree for a wire format that is a dozen JSON fields wide.
    "httpx>=0.27",
]

# Dependency budget is fixed by the Phase 1 plan (P1-1). Anything not listed here is an
# argument to be made in review, not a default. No ORM (D20), no extra runtime packages.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["archetype*"]

[tool.setuptools.package-data]
archetype = ["projects/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: touches a real provider or network; excluded by default (outline § 8)",
]
addopts = "-m 'not live'"
filterwarnings = ["error::DeprecationWarning:archetype.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
